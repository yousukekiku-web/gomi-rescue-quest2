<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
<title>ゴミレスキュークエスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe8f5; --skydeep:#8fd0ea;
  --blue:#2a72d4; --blued:#0f4f9c;
  --teal:#0f8f83; --tealdeep:#0a6b62;
  --purple:#7653c8; --purpled:#4a287d;
  --gold:#ffb300; --green:#2ecc71; --ink:#2a3a4a;
  --gray:#9aa7b0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;color:var(--ink);}
body{background:linear-gradient(180deg,var(--sky),var(--skydeep));display:flex;align-items:center;justify-content:center;}

#app{width:100%;max-width:460px;height:100%;max-height:900px;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.25);}
@media(min-width:521px){#app{border-radius:28px;height:92vh;}}

.hero{background:linear-gradient(180deg,var(--sky),var(--skydeep));text-align:center;
  padding:max(env(safe-area-inset-top),22px) 20px 20px;}
.truck{font-size:clamp(46px,13vw,64px);animation:bob 2.4s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.g-title{font-family:'Fredoka One',sans-serif;font-size:clamp(26px,7.5vw,36px);color:var(--blue);
  text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(0,60,120,.12);margin-top:2px;}
.g-sub{font-size:12px;font-weight:900;color:#1a5fa0;letter-spacing:.12em;margin-top:2px;}

.story{margin:14px 18px 0;background:#fff8e8;border:2px dashed #f0d189;border-radius:16px;padding:14px 16px;
  font-size:12.5px;line-height:1.85;font-weight:700;color:#6a5320;text-align:left;}
.story b{color:#c2740a;}

.city-wrap{margin:16px 18px 4px;background:#eef7ff;border-radius:16px;padding:14px 16px;box-shadow:inset 0 1px 4px rgba(0,0,0,.06);}
.city-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.city-label{font-size:11.5px;font-weight:900;color:#3378b8;letter-spacing:.05em;}
.city-pct{font-family:'Fredoka One',sans-serif;font-size:16px;color:#1a3a5a;}
.city-bar{height:14px;background:#dbeaf5;border-radius:7px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.12);}
.city-bar-fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#ffb14d,#2ecc71);transition:width .5s ease;}
.city-scene{text-align:center;font-size:26px;margin-top:8px;letter-spacing:2px;}
.city-scene img{width:100%;height:auto;display:block;border-radius:10px;}

.stages{padding:16px 18px 8px;display:flex;flex-direction:column;gap:12px;}
.stage-card{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;
  box-shadow:0 4px 14px rgba(0,0,0,.1);text-decoration:none;color:inherit;position:relative;overflow:hidden;}
.stage-card.locked{opacity:.55;filter:grayscale(.5);pointer-events:none;}
.sc-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;box-shadow:0 3px 8px rgba(0,0,0,.15);color:#fff;}
.sc1{background:#fff5f0;} .sc1 .sc-icon{background:linear-gradient(135deg,#5a9cf0,var(--blue));}
.sc2{background:#fff8ec;} .sc2 .sc-icon{background:linear-gradient(135deg,#17ab9d,var(--teal));}
.sc3{background:#f6f0ff;} .sc3 .sc-icon{background:linear-gradient(135deg,#8a64dd,var(--purple));}
.sc-body{flex:1;min-width:0;}
.sc-title{font-family:'Fredoka One',sans-serif;font-size:15px;color:var(--ink);}
.sc-desc{font-size:10.5px;font-weight:700;color:#6a7a88;margin-top:1px;}
.sc-status{font-size:10px;font-weight:900;margin-top:4px;}
.sc-status.clear{color:#1f9c53;}
.sc-status.locked-lb{color:#9aa7b0;}
.sc-rank{font-family:'Fredoka One',sans-serif;font-size:22px;width:38px;text-align:center;flex-shrink:0;}
.lock-emoji{font-size:20px;flex-shrink:0;}

.result-card{margin:4px 18px 18px;display:flex;align-items:center;gap:12px;border-radius:18px;padding:14px;
  background:linear-gradient(135deg,#2a2140,#4a3672);color:#fff;text-decoration:none;box-shadow:0 6px 18px rgba(40,20,70,.35);}
.result-card.locked{opacity:.5;filter:grayscale(.6);pointer-events:none;}
.result-card .sc-icon{background:linear-gradient(135deg,var(--gold),#ff8a00);}
.result-card .sc-title{color:#fff;}
.result-card .sc-desc{color:#d8cdf0;}

.foot-row{padding:4px 18px 26px;text-align:center;}
.btn-reset{background:none;border:none;font-size:11px;color:#9aa7b0;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px;}
.gi{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;flex-shrink:0;}
.home-link .gi,.bgm-btn .gi,.refresh-btn .gi{width:24px;height:24px;vertical-align:0;}
.truck img{width:clamp(70px,20vw,100px);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18));}
.stage-card .sc-icon.has-img,.result-card .sc-icon.has-img{background:#fff;}
.sc-icon.has-img img{width:40px;height:40px;object-fit:contain;display:block;}
.lock-emoji .gi{width:20px;height:20px;vertical-align:0;}
.sc-status .gi{width:1.25em;height:1.25em;}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="5.5" y="11" width="13" height="9.5" rx="1" fill="#fff3d6"/><path d="M3 11.8 12 3.5l9 8.3z" fill="#e8554e"/><rect x="10" y="14.5" width="4" height="6" rx=".6" fill="#a3703a"/></symbol><symbol id="i-sound-on" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 9.5H7.5L12.5 5.5v13L7.5 14.5H3.5z" fill="#5aa0f0"/><path d="M15.5 9c1.5 1.7 1.5 4.3 0 6" fill="none"/><path d="M18.2 6.3c3 3.2 3 8.2 0 11.4" fill="none"/></symbol><symbol id="i-sound-off" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M3.5 9.5H7.5L12.5 5.5v13L7.5 14.5H3.5z" fill="#aab4c0"/><path d="M15.8 9.3l5 5.4M20.8 9.3l-5 5.4" fill="none" stroke="#e8554e" stroke-width="2"/></symbol><symbol id="i-lock" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#8a95a3" stroke-width="2"/><rect x="5" y="11" width="14" height="10" rx="2.2" fill="#f2b630"/><circle cx="12" cy="15.6" r="1.5" fill="#3b2a1a" stroke="none"/><path d="M12 16.5v2" fill="none"/></symbol><symbol id="i-heart" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 20.5C5 15.6 3 11.6 3 8.6A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 9 1.6c0 3-2 7-9 11.9z" fill="#ee5a6f"/></symbol><symbol id="i-timer" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="9.6" y="2.2" width="4.8" height="2.6" rx=".8" fill="#8a95a3"/><circle cx="12" cy="13.6" r="7.6" fill="#fff"/><path d="M12 13.6V9" fill="none" stroke-width="1.8"/><path d="M12 13.6l3 1.8" fill="none"/></symbol><symbol id="i-ok" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3.2"/></symbol><symbol id="i-ng" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13" fill="none" stroke="currentColor" stroke-width="3.4"/></symbol><symbol id="i-star" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><polygon points="12.00,2.40 14.70,9.08 21.89,9.59 16.37,14.22 18.11,21.21 12.00,17.40 5.89,21.21 7.63,14.22 2.11,9.59 9.30,9.08" fill="#ffd23f"/></symbol><symbol id="i-warning" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.4 22 20.6H2z" fill="#ffcc33"/><path d="M12 9.6v5" fill="none" stroke-width="1.8"/><circle cx="12" cy="17.6" r=".5" fill="#3b2a1a"/></symbol><symbol id="i-burst" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><polygon points="12.00,1.00 13.85,6.29 18.47,3.10 16.85,8.47 22.46,8.60 18.00,12.00 22.46,15.40 16.85,15.53 18.47,20.90 13.85,17.71 12.00,23.00 10.15,17.71 5.53,20.90 7.15,15.53 1.54,15.40 6.00,12.00 1.54,8.60 7.15,8.47 5.53,3.10 10.15,6.29" fill="#ff8a3d"/><polygon points="12.00,5.80 12.99,8.96 15.64,6.98 14.59,10.12 17.90,10.08 15.20,12.00 17.90,13.92 14.59,13.88 15.64,17.02 12.99,15.04 12.00,18.20 11.01,15.04 8.36,17.02 9.41,13.88 6.10,13.92 8.80,12.00 6.10,10.08 9.41,10.12 8.36,6.98 11.01,8.96" fill="#ffd23f" stroke="none"/></symbol><symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(0 12 12)"/><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(45 12 12)"/><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(90 12 12)"/><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(135 12 12)"/><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(180 12 12)"/><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(225 12 12)"/><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(270 12 12)"/><rect x="10.1" y="1.8" width="3.8" height="5" rx=".7" fill="#9aa5b1" transform="rotate(315 12 12)"/><circle cx="12" cy="12" r="7" fill="#9aa5b1"/><circle cx="12" cy="12" r="2.6" fill="#fff"/></symbol><symbol id="i-tire" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9.2" fill="#444"/><circle cx="12" cy="12" r="4.6" fill="#c8ced6"/><circle cx="12" cy="12" r="1.3" fill="#3b2a1a" stroke="none"/></symbol><symbol id="i-puff" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="8" cy="13.5" r="4.2" fill="#fff" stroke="#9aa5b1"/><circle cx="13.2" cy="10.5" r="5.2" fill="#fff" stroke="#9aa5b1"/><circle cx="17.2" cy="14.4" r="4" fill="#fff" stroke="#9aa5b1"/><circle cx="8" cy="13.5" r="3.6" fill="#fff" stroke="none"/><circle cx="13.2" cy="10.5" r="4.6" fill="#fff" stroke="none"/><circle cx="17.2" cy="14.4" r="3.4" fill="#fff" stroke="none"/><rect x="8" y="14" width="9.4" height="4.2" fill="#fff" stroke="none"/></symbol><symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M12 21.4s-6.8-6.4-6.8-11.4a6.8 6.8 0 0 1 13.6 0c0 5-6.8 11.4-6.8 11.4z" fill="#e8554e"/><circle cx="12" cy="10" r="2.5" fill="#fff"/></symbol><symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M19.6 12a7.6 7.6 0 1 1-2.4-5.5" fill="none" stroke="#3b6fd8" stroke-width="2.4"/><path d="M20.8 3.6v5.6h-5.6z" fill="#3b6fd8" stroke="#3b6fd8" stroke-width="1"/></symbol><symbol id="i-pencil" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><path d="M4 20l1.3-4.8L16.2 4.3a2.1 2.1 0 0 1 3 0l.5.5a2.1 2.1 0 0 1 0 3L8.8 18.7z" fill="#f5c542"/><path d="M15 5.5l3.5 3.5" fill="none"/><path d="M4 20l1.3-4.8 3.5 3.5z" fill="#f3d9a8"/></symbol><symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="#3b2a1a" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="9.2" fill="#2ecc71"/><path d="M7.4 12.4l3.1 3.1 6.1-6.6" fill="none" stroke="#fff" stroke-width="2.5"/></symbol></defs></svg>
<script>function gi(id,cls){return '<svg class="gi'+(cls?' '+cls:'')+'" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-'+id+'"/></svg>';}var GI_FIRE='<img class="gi" src="assets/bin-burn.png?v=20261025" alt="">',GI_TRUCK='<img class="ci-img" src="assets/truck.png?v=20261025" alt="">';</script>

<div id="app">

  <div class="hero">
    <div class="truck"><img src="assets/truck.png?v=20261025" alt="" onerror="this.replaceWith(document.createTextNode('🚛'))"></div>
    <div class="g-title">ゴミレスキュークエスト</div>
    <div class="g-sub">GOMI RESCUE QUEST</div>
  </div>

  <div class="story" id="story-text"></div>

  <div class="city-wrap">
    <div class="city-row">
      <span class="city-label">街のクリーンさ</span>
      <span class="city-pct" id="city-pct">0%</span>
    </div>
    <div class="city-bar"><div class="city-bar-fill" id="city-bar-fill" style="width:0%;"></div></div>
    <div class="city-scene" id="city-scene"></div>
  </div>

  <div class="stages" id="stages"></div>

  <a href="gomi_rescue_result.html" class="result-card locked" id="result-card">
    <div class="sc-icon has-img"><img src="assets/trophy.png?v=20261025" alt="" onerror="this.replaceWith(document.createTextNode('🏆'))"></div>
    <div class="sc-body">
      <div class="sc-title">最終結果 &amp; ランキング</div>
      <div class="sc-desc" id="result-desc">3ステージすべてクリアすると解放されます</div>
    </div>
    <span class="lock-emoji" id="result-lock"><svg class="gi" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-lock"/></svg></span>
  </a>

  <div class="foot-row"><button class="btn-reset" id="btn-reset">進行状況をリセットする</button></div>

</div>

<script>
const STORY_DEFAULT = 'ここ数年、街には危険なゴミがどんどん増えてきた……分別ミスによる収集車の発火事故、街のあちこちに散らばる放置ごみ。このままでは街はゴミに埋もれてしまう。<br><br><b>頼れるレスキュー隊員はキミしかいない。</b><br>3つのステージを乗りこえて、街を守ろう！';

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem('grq_progress') || '{}'); }
  catch(e){ return {}; }
}

const STAGES = [
  {num:1, cls:'sc1', icon:'🚛', title:'ステージ1', desc:'仕分けクイズ循環型ゲーム', href:'gomi_rescue_stage1.html'},
  {num:2, cls:'sc2', icon:'🔍', title:'ステージ2', desc:'4大危険物さがし', href:'gomi_rescue_stage2.html'},
  {num:3, cls:'sc3', icon:'🧠', title:'ステージ3', desc:'ひらめき安全クイズ', href:'gomi_rescue_stage3.html'},
];
const RANK_COLOR = {S:'#ffb300', A:'#2a72d4', B:'#4caf50', C:'#ff9800'};

function render(){
  const p = loadProgress();
  const clearedCount = STAGES.filter(s => p['stage'+s.num] && p['stage'+s.num].rank4).length;
  const pct = Math.round(clearedCount/3*100);
  document.getElementById('city-pct').textContent = pct+'%';
  document.getElementById('city-bar-fill').style.width = pct+'%';
  const scenes = ['🏚️💨🗑️🗑️🗑️','🏘️🗑️🗑️🌥️','🏢🌤️🗑️🌳','🏙️✨🌳🌳✨'];
  // 街の絵：荒れた街 → きれいな街（画像が読み込めない場合は絵文字で代替）
  const CITY_ALT = ['ごみであふれた街','少し片づいた街','かなりきれいになった街','すっかりきれいな街'];
  const cityEl = document.getElementById('city-scene');
  cityEl.innerHTML = '';
  const cityImg = new Image();
  cityImg.alt = CITY_ALT[clearedCount];
  cityImg.onerror = ()=>{ cityEl.textContent = scenes[clearedCount]; };
  cityImg.src = 'assets/city-'+clearedCount+'.png?v=20261025';
  cityEl.appendChild(cityImg);

  const storyEl = document.getElementById('story-text');
  if(clearedCount===0) storyEl.innerHTML = STORY_DEFAULT;
  else if(clearedCount<3) storyEl.innerHTML = '街のゴミは少しずつ片づいてきた。でも、まだ危険は残っている……<br><b>次のステージに向かおう！</b>';
  else storyEl.innerHTML = '3つのミッションを乗り越え、街はすっかり見違えるほどキレイになった。<br><b>最後に、キミの活躍の結果を確認しよう！</b>';

  const wrap = document.getElementById('stages');
  wrap.innerHTML='';
  STAGES.forEach((s,i)=>{
    const prev = i===0 ? true : !!(p['stage'+STAGES[i-1].num] && p['stage'+STAGES[i-1].num].rank4);
    const done = p['stage'+s.num] && p['stage'+s.num].rank4;
    const a = document.createElement('a');
    a.className = 'stage-card '+s.cls+(prev?'':' locked');
    a.href = prev ? s.href : '#';
    let statusHtml;
    if(!prev) statusHtml = '<div class="sc-status locked-lb">'+gi('lock')+' 前のステージをクリアしてね</div>';
    else if(done) statusHtml = '<div class="sc-status clear">'+gi('check')+' クリア済み</div>';
    else statusHtml = '<div class="sc-status" style="color:#c2740a;">▶ 挑戦できます！</div>';
    a.innerHTML = `<div class="sc-icon has-img"><img src="assets/stage-icon-${s.num}.png?v=20261025" alt="" onerror="this.replaceWith(document.createTextNode('${s.icon}'))"></div>
      <div class="sc-body"><div class="sc-title">${s.title}｜${s.desc}</div>${statusHtml}</div>
      ${done ? `<div class="sc-rank" style="color:${RANK_COLOR[p['stage'+s.num].rank4]}">${p['stage'+s.num].rank4}</div>` : (prev ? '' : '<span class="lock-emoji">'+gi('lock')+'</span>')}`;
    wrap.appendChild(a);
  });

  const resultCard = document.getElementById('result-card');
  const resultDesc = document.getElementById('result-desc');
  const resultLock = document.getElementById('result-lock');
  if(clearedCount>=3){
    resultCard.classList.remove('locked');
    resultDesc.textContent = 'キミの称号を確認して、ランキングに登録しよう！';
    resultLock.textContent = '▶';
  } else {
    resultDesc.textContent = `あと${3-clearedCount}ステージクリアで解放されます`;
    resultLock.innerHTML = gi('lock');
  }
}
render();

document.getElementById('btn-reset').addEventListener('click', ()=>{
  if(confirm('進行状況をリセットします。よろしいですか？')){
    try{ localStorage.removeItem('grq_progress'); }catch(e){}
    render();
  }
});
</script>
</body>
</html>
