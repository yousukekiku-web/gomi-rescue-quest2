<style>
:root{
  --gold:#ffb300; --purple:#7653c8; --purpled:#4a287d; --ink:#2a3a4a;
  --blue:#2a72d4; --teal:#0f8f83;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;color:var(--ink);}
body{background:linear-gradient(160deg,#2a2140,#4a3672);display:flex;align-items:center;justify-content:center;}

#app{width:100%;max-width:460px;height:100%;max-height:900px;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.3);}
@media(min-width:521px){#app{border-radius:28px;height:92vh;}}

.home-link{position:fixed;top:max(env(safe-area-inset-top),10px);left:12px;z-index:999;
  width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.85);border:none;
  font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.15);cursor:pointer;display:flex;
  align-items:center;justify-content:center;text-decoration:none;color:inherit;}
.home-link:active{transform:scale(.9);}

/* ===== incomplete notice ===== */
.notice{padding:40px 24px;text-align:center;}
.notice .em{font-size:52px;margin-bottom:10px;}
.notice h2{font-family:'Fredoka One',sans-serif;font-size:20px;color:var(--purpled);margin-bottom:10px;}
.notice p{font-size:12.5px;font-weight:700;color:#5a5570;line-height:1.8;margin-bottom:20px;}
.notice a{display:inline-block;background:linear-gradient(135deg,#8a64dd,var(--purple));color:#fff;
  text-decoration:none;font-family:'Fredoka One',sans-serif;font-size:15px;padding:12px 30px;border-radius:40px;
  box-shadow:0 5px 0 var(--purpled);}

/* ===== ending ===== */
.ending{background:linear-gradient(160deg,#2a2140,#4a3672);color:#fff;text-align:center;
  padding:max(env(safe-area-inset-top),26px) 22px 22px;}
.end-emoji{font-size:44px;}
.end-title{font-family:'Fredoka One',sans-serif;font-size:20px;color:#ffe27a;margin:4px 0 10px;text-shadow:0 2px 0 rgba(0,0,0,.3);}
.end-copy{font-size:12px;font-weight:700;line-height:1.9;color:#e6ddff;max-width:360px;margin:0 auto;}
.end-copy b{color:#ffe27a;}

/* ===== character card ===== */
.charcard{margin:18px 18px 6px;background:linear-gradient(160deg,#fff,#f6f0ff);border-radius:22px;padding:26px 20px;
  text-align:center;box-shadow:0 10px 26px rgba(60,30,110,.25);border:3px solid #e6d9fa;}
.charcard .badge{display:inline-block;background:linear-gradient(135deg,var(--purpled),var(--purple));color:#fff;
  font-family:'Fredoka One',sans-serif;font-size:11px;padding:4px 16px;border-radius:20px;letter-spacing:.1em;margin-bottom:12px;}
.char-visual{display:flex;align-items:center;justify-content:center;width:184px;height:230px;margin:0 auto 8px;
  border-radius:20px;overflow:hidden;box-shadow:0 10px 22px rgba(60,30,110,.28);background:#f6f0ff;}
.char-visual .emoji-fallback{font-size:96px;line-height:1;}
.char-visual .char-icon-img{width:100%;height:100%;object-fit:cover;display:block;}
.charcard .title{font-family:'Fredoka One',sans-serif;font-size:clamp(22px,7vw,28px);color:var(--purpled);line-height:1.3;}
.charcard .code{font-family:'Fredoka One',sans-serif;font-size:13px;color:#9a7fd0;letter-spacing:.2em;margin-top:4px;}
.charcard.rare{background:linear-gradient(160deg,#fff8e0,#ffe9b3);border-color:#ffcf4d;
  box-shadow:0 0 0 3px #fff, 0 0 0 6px #ffcf4d, 0 12px 30px rgba(200,140,0,.35);animation:rareGlow 2.2s ease-in-out infinite;}
@keyframes rareGlow{0%,100%{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffcf4d,0 12px 30px rgba(200,140,0,.35);}
  50%{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffe27a,0 16px 40px rgba(255,180,0,.55);}}
.badge.rare{background:linear-gradient(135deg,#ff8a00,#ffcf4d);color:#5a3a00;}
.rare-sub{margin-top:10px;font-size:11.5px;font-weight:700;color:#8a6a20;line-height:1.7;
  background:#fffdf6;border-radius:10px;padding:10px 12px;text-align:left;}
.stat-lines{margin-top:16px;text-align:left;display:flex;flex-direction:column;gap:8px;}
.stat-line{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,.07);}
.stat-rank{font-family:'Fredoka One',sans-serif;font-size:20px;width:28px;text-align:center;flex-shrink:0;}
.stat-body{flex:1;}
.stat-cat{font-size:9.5px;font-weight:900;color:#9a86b8;letter-spacing:.05em;}
.stat-desc{font-size:12px;font-weight:900;color:var(--ink);}

.recap{margin:14px 18px;background:#f4f8fc;border-radius:16px;padding:12px 16px;}
.recap-title{font-size:11px;font-weight:900;color:#5a7590;margin-bottom:8px;}
.recap-row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:5px 0;border-bottom:1px solid #e6edf3;}
.recap-row:last-child{border:none;}
.recap-row b{font-family:'Fredoka One',sans-serif;color:var(--blue);}

/* ===== register ===== */
.cta-row{padding:6px 18px 26px;}
.btn-cta{width:100%;padding:16px;border:none;border-radius:40px;background:linear-gradient(135deg,#5edd7a,#2ecc71);
  color:#fff;font-family:'Fredoka One',sans-serif;font-size:15px;line-height:1.4;cursor:pointer;box-shadow:0 5px 0 #1f9c53;
  text-decoration:none;display:block;text-align:center;}
.btn-cta:active{transform:translateY(3px);box-shadow:0 2px 0 #1f9c53;}
.btn-cta small{display:block;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;font-size:10.5px;font-weight:700;margin-top:3px;opacity:.9;}
.btn-home-text{display:block;text-align:center;font-size:11px;font-weight:700;color:#9a86b8;text-decoration:underline;margin-top:12px;}
</style>

<body>
<div id="app">

</div>

<script>
// ════════════════════════════════════════════════
// データテーブル
// ════════════════════════════════════════════════
const RANK_VAL = {S:4, A:3, B:2, C:1};
const RANK_COLOR = {S:'#ffb300', A:'#2a72d4', B:'#4caf50', C:'#ff9800'};

const DESCS = {
  stage1: {
    cat: '仕分けの腕前',
    S: '神業の仕分け人', A: '頼れる仕分け上手',
    B: '見習いの仕分け係', C: '仕分けはまだまだこれから'
  },
  stage2: {
    cat: '危険物発見力',
    S: '危険を一瞬で見抜く鷹の目', A: 'しっかり周りを見渡せる観察者',
    B: 'たまに見逃す新米サーチャー', C: '危険物にはまだ気づきにくい'
  },
  stage3: {
    cat: '安全知識',
    S: '安全知識の生き字引', A: '正しい知識をしっかり持つ',
    B: '知識はまだ半人前', C: '安全知識はこれから学ぶ段階'
  }
};

// 3ステージのランク合計（3〜12）が「称号の格」を決める（0〜5の6段階）。
// 称号×3ステージのコードで 4×4×4 = 64通りの「実力タイプ」が存在する。
const TIER_META = [
  {title:'ただの一般人'},
  {title:'見習いレスキュー隊員'},
  {title:'半人前クリーナー'},
  {title:'頼れる清掃レンジャー'},
  {title:'エリート・ゴミレスキュー隊員'},
  {title:'完全なる掃除人'}
];
function tierIndexFromSum(sum){
  if(sum<=3) return 0;
  if(sum<=5) return 1;
  if(sum<=7) return 2;
  if(sum<=9) return 3;
  if(sum<=11) return 4;
  return 5;
}

// ════════════════════════════════════════════════
// 見た目キャラクター・ガチャプール
// 各「格」ごとに、少年・少女・青年・老人・（たまに）動物など見た目のまったく違う
// バリエーションを用意し、結果を見るたびに1体を抽選する（ガチャ演出）。
// 実力の「格」（＝プレイの成績）はプールを絞るのに使うが、その中の誰が出るかは毎回ランダム。
// ════════════════════════════════════════════════
const TIER_VARIANTS = [
  // 0: ただの一般人
  [
    {id:'t0_boy', emoji:'🧒', name:'ぼーっとした少年', sub:'ごみの分別に興味を持ちはじめたばかり。'},
    {id:'t0_girl', emoji:'👧', name:'まだ自信のない少女', sub:'仕分けはまだドキドキしながらやっている。'},
    {id:'t0_man', emoji:'🧑', name:'寝ぼけまなこの青年', sub:'なんとなく毎日をすごしている一般人。'},
    {id:'t0_woman', emoji:'👩', name:'ちょっぴり忙しい女性', sub:'ごみのことまで手が回っていない。'},
    {id:'t0_tanuki', emoji:'🦝', name:'まよいこんだ子だぬき', sub:'いたずら好きで、ごみ箱をあさりがち。'}
  ],
  // 1: 見習いレスキュー隊員
  [
    {id:'t1_boy', emoji:'🧑‍🚒', name:'元気いっぱいの少年隊員', sub:'制服はまだ少し大きい、やる気だけは満点。'},
    {id:'t1_girl', emoji:'👧', name:'はりきり少女隊員', sub:'先輩の真似をして仕分けを練習中。'},
    {id:'t1_man', emoji:'👨‍🚒', name:'新人青年レスキュー', sub:'配属されたばかりでドキドキしている。'},
    {id:'t1_woman', emoji:'👩‍🚒', name:'新人女性レスキュー', sub:'まっすぐな気持ちで街のために動く。'},
    {id:'t1_neko', emoji:'🐈', name:'おっちょこちょいの野良ねこ隊員', sub:'なぜか隊員服を着ている野良ねこ。'}
  ],
  // 2: 半人前クリーナー
  [
    {id:'t2_boy', emoji:'🧑‍🔧', name:'成長中の少年クリーナー', sub:'コツをつかみはじめた自信がにじむ。'},
    {id:'t2_girl', emoji:'👧', name:'負けん気の少女クリーナー', sub:'苦手な危険物さがしも特訓中。'},
    {id:'t2_man', emoji:'🧔', name:'ベテラン見習いの男性', sub:'不器用だが真面目にこつこつ働く。'},
    {id:'t2_woman', emoji:'👩‍🔧', name:'てきぱき女性クリーナー', sub:'手際のよさが評判になりはじめた。'},
    {id:'t2_karasu', emoji:'🐦‍⬛', name:'がんばりやのカラス隊員', sub:'高いところから街を見張る鳥の相棒。'}
  ],
  // 3: 頼れる清掃レンジャー
  [
    {id:'t3_man', emoji:'🦸‍♂️', name:'頼れる青年レンジャー', sub:'ピンチの街をいくつも救ってきた実力者。'},
    {id:'t3_woman', emoji:'🦸‍♀️', name:'頼れる女性レンジャー', sub:'冷静な判断力で仲間を導く。'},
    {id:'t3_ojisan', emoji:'👨‍🦳', name:'貫禄のあるおじさんレンジャー', sub:'現場歴が長く、街のことを知り尽くす。'},
    {id:'t3_obasan', emoji:'👩‍🦳', name:'貫禄のあるおばさんレンジャー', sub:'ご近所さんからの信頼も厚い。'},
    {id:'t3_kitsune', emoji:'🦊', name:'森からきたキツネレンジャー', sub:'街と森をつなぐ不思議な仲間。'}
  ],
  // 4: エリート・ゴミレスキュー隊員
  [
    {id:'t4_man', emoji:'🕴️', name:'エリート青年隊員', sub:'どんな依頼も完璧にこなすホープ。'},
    {id:'t4_woman', emoji:'👩‍💼', name:'エリート女性隊員', sub:'街中から指名がくる敏腕レスキュー。'},
    {id:'t4_grandpa', emoji:'👴', name:'熟練のおじいちゃん隊員', sub:'長年の経験がにじみ出るベテラン中のベテラン。'},
    {id:'t4_grandma', emoji:'👵', name:'熟練のおばあちゃん隊員', sub:'その知恵に助けられた住民は数知れず。'},
    {id:'t4_wolf', emoji:'🐺', name:'伝説と噂されるオオカミ隊員', sub:'夜の街を静かに見回る謎の相棒。'}
  ],
  // 5: 完全なる掃除人（通常枠。★スーパーレア3種は下のRARE_CHARACTERSで別管理）
  [
    {id:'t5_boy', emoji:'🧑‍🎓', name:'完全なる掃除・少年天才', sub:'若くしてすべてを極めた神童。'},
    {id:'t5_girl', emoji:'👧', name:'完全なる掃除・少女天才', sub:'その年齢ですでに街の伝説になりつつある。'},
    {id:'t5_man', emoji:'🦹‍♂️', name:'完全なる掃除人（青年）', sub:'迷いのない一挙一動、まさに完璧。'},
    {id:'t5_woman', emoji:'🦹‍♀️', name:'完全なる掃除人（女性）', sub:'すべての判断が街を守る答えになる。'},
    {id:'t5_elder', emoji:'🧙', name:'伝説の長老掃除人', sub:'何十年も街を見守り続けてきた生きる伝説。'}
  ]
];
function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ════════════════════════════════════════════════
// SSSランク限定・スーパーレアキャラ（3種）
// SSS（合計12＝全ステージSランク）に到達したとき、1体につき1/30の確率で
// 通常枠（上のt5_*）の代わりに出現する（3体合計で1/10の確率）。
// ════════════════════════════════════════════════
const RARE_CHARACTERS = [
  {
    id:'rare1', emoji:'🔥🌿',
    title:'不死鳥アッシュフェニックス',
    sub:'燃やしたはずのごみの灰から、新しい緑が芽吹く。すべてを浄化し、循環させる伝説の存在。',
    prompt:"Legendary phoenix-themed mascot character for a Japanese kids' recycling-rescue adventure game, titled '不死鳥アッシュフェニックス (Ash Phoenix)'. Rising from a small pile of glowing ash, wings made of stylized flames blending into green leaves and recycling-arrow symbols, warm gradient of deep red-orange transitioning into fresh green along the wingtips, glowing golden eyes, confident triumphant pose with wings spread. Flat vector illustration style, soft rounded shapes, thick clean outlines, bright cheerful colors, simple gradient or transparent background, no text, full body, character-sheet reference pose."
  },
  {
    id:'rare2', emoji:'⚖️✨',
    title:'選別の神ワケルシン',
    sub:'太古よりごみの分別を見守ってきたといわれる、街の守り神。四本の腕で、迷わずすべてを正しい場所へ導く。',
    prompt:"Legendary deity-themed mascot character for a Japanese kids' recycling-rescue adventure game, titled '選別の神ワケルシン (Wakerushin, God of Sorting)'. A small, friendly shrine-guardian-like spirit with four gentle arms, each hand holding a miniature glowing bin (red flame bin, blue non-burnable bin, green recycling bin, pink wait/hold bin), soft flowing robe patterned with recycling arrows, a serene smiling expression, faint halo of light behind the head shaped like a circular recycling symbol. Flat vector illustration style, soft rounded shapes, thick clean outlines, bright cheerful pastel-and-gold colors, simple gradient or transparent background, no text, full body, character-sheet reference pose."
  },
  {
    id:'rare3', emoji:'👑🏙️',
    title:'クリーン・エンペラー',
    sub:'完全に浄化された街に君臨する、清掃者たちの頂点。その姿を見た者は、二度とごみを見捨てない。',
    prompt:"Legendary emperor-themed mascot character for a Japanese kids' recycling-rescue adventure game, titled 'クリーン・エンペラー (Clean Emperor)'. A small regal chibi figure wearing golden ceremonial armor with a flowing cape shaped like a miniature glittering cityscape skyline, a crown made of interlocking recycling-arrow symbols, holding a golden scepter topped with a sparkling truck emblem, standing tall with a proud confident smile, sparkling city skyline silhouette faintly visible behind. Flat vector illustration style, soft rounded shapes, thick clean outlines, bright cheerful gold-and-blue colors, simple gradient or transparent background, no text, full body, character-sheet reference pose."
  }
];

// この「実績（3ステージのクリア時刻の組み合わせ）」1回につき1回だけ抽選し、
// 同じ結果画面をリロードしても毎回変わらないようにする（＝再挑戦するたびに新しい抽選＝ガチャ）。
function rollCharacterVariant(tierIndex, fingerprint){
  try{
    const saved = JSON.parse(localStorage.getItem('grq_char_roll') || 'null');
    if(saved && saved.fp === fingerprint) return saved;
  }catch(e){}
  let variantId = null, rareId = null;
  if(tierIndex === 5){
    const roll = Math.floor(Math.random()*30); // 0..29
    if(roll < 3){ rareId = RARE_CHARACTERS[roll].id; }
    else{ variantId = pickRandom(TIER_VARIANTS[5]).id; }
  } else {
    variantId = pickRandom(TIER_VARIANTS[tierIndex]).id;
  }
  const result = {fp: fingerprint, tierIndex, variantId, rareId};
  try{ localStorage.setItem('grq_char_roll', JSON.stringify(result)); }catch(e){}
  return result;
}

function loadProgress(){
  try{ return JSON.parse(localStorage.getItem('grq_progress') || '{}'); }
  catch(e){ return {}; }
}

// ════════════════════════════════════════════════
// 描画
// ════════════════════════════════════════════════
async function main(){
  const p = loadProgress();
  const s1 = p.stage1, s2 = p.stage2, s3 = p.stage3;
  const content = document.getElementById('content');

  if(!s1 || !s2 || !s3){
    content.innerHTML = `
      <div class="notice">
        <div class="em">🔒</div>
        <h2>まだ結果を見られません</h2>
        <p>3つのステージすべてをクリアすると、<br>キミの最終キャラクターと称号がここに表示されます。</p>
        <a href="gomi_rescue_start.html">ホームへ戻る</a>
      </div>`;
    return;
  }

  const code = s1.rank4 + s2.rank4 + s3.rank4;
  const sum = RANK_VAL[s1.rank4] + RANK_VAL[s2.rank4] + RANK_VAL[s3.rank4];
  const tierIndex = tierIndexFromSum(sum);
  const tierTitle = TIER_META[tierIndex].title;
  const totalScore = sum*1000 + (s1.score||0) + (s2.found||0)*50 + (s3.correct||0)*50;

  // ガチャ抽選：同じ実績（3ステージのクリア時刻の組み合わせ）につき1回だけ抽選し、
  // 再挑戦して新しい実績になるたびに新しいキャラクターが出るようにする
  const fingerprint = [s1.ts, s2.ts, s3.ts].join('|');
  const roll = rollCharacterVariant(tierIndex, fingerprint);
  const rare = roll.rareId ? RARE_CHARACTERS.find(r=>r.id===roll.rareId) : null;
  const variant = (!rare) ? (TIER_VARIANTS[tierIndex].find(v=>v.id===roll.variantId) || TIER_VARIANTS[tierIndex][0]) : null;

  const cardEmoji = rare ? rare.emoji : variant.emoji;
  const cardTitle = rare ? rare.title : `${variant.name}｜${tierTitle}`;
  const cardBadgeText = rare ? '★★★ スーパーレア ★★★' : 'FINAL CHARACTER';
  const cardSub = rare ? rare.sub : variant.sub;
  // 将来キャラクター画像を chars/{imgKey}.png として追加すると、絵文字の代わりに自動で表示される
  const imgKey = rare ? `rare_${rare.id}` : variant.id;

  content.innerHTML = `
    <div class="ending">
      <div class="end-emoji">🏙️✨</div>
      <div class="end-title">街に、静かな平和がもどってきた。</div>
      <div class="end-copy">危険なごみに埋もれかけていた街は、キミの3つの活躍によって少しずつ息を吹きかえした。<br>正しく仕分け、危険を見抜き、正しい知識で判断する――<br><b>街を守ったのは、他の誰でもない、あなたの行動だ。</b></div>
    </div>

    <div class="charcard${rare?' rare':''}">
      <div class="badge${rare?' rare':''}">${cardBadgeText}</div>
      <div class="char-visual" id="char-visual"><div class="emoji-fallback">${cardEmoji}</div></div>
      <div class="title">${cardTitle}</div>
      <div class="code">RANK CODE：${code}</div>
      <div class="rare-sub">${cardSub}</div>
      <div class="stat-lines">
        <div class="stat-line"><div class="stat-rank" style="color:${RANK_COLOR[s1.rank4]}">${s1.rank4}</div><div class="stat-body"><div class="stat-cat">STAGE1・${DESCS.stage1.cat}</div><div class="stat-desc">${DESCS.stage1[s1.rank4]}</div></div></div>
        <div class="stat-line"><div class="stat-rank" style="color:${RANK_COLOR[s2.rank4]}">${s2.rank4}</div><div class="stat-body"><div class="stat-cat">STAGE2・${DESCS.stage2.cat}</div><div class="stat-desc">${DESCS.stage2[s2.rank4]}</div></div></div>
        <div class="stat-line"><div class="stat-rank" style="color:${RANK_COLOR[s3.rank4]}">${s3.rank4}</div><div class="stat-body"><div class="stat-cat">STAGE3・${DESCS.stage3.cat}</div><div class="stat-desc">${DESCS.stage3[s3.rank4]}</div></div></div>
      </div>
    </div>

    <div class="recap">
      <div class="recap-title">📋 プレイ記録</div>
      <div class="recap-row"><span>ステージ1 スコア</span><b>${(s1.score||0).toLocaleString()}</b></div>
      <div class="recap-row"><span>ステージ2 発見数</span><b>${s2.found||0}/${s2.total||0}</b></div>
      <div class="recap-row"><span>ステージ3 正解数</span><b>${s3.correct||0}/${s3.total||0}</b></div>
    </div>

    <div class="cta-row">
      <a href="gomi_rescue_ranking.html" class="btn-cta">🔋 街のリチウム電池の回収場所を探そう！
        <small>ランキングに登録して、キミの発見を記録しよう</small>
      </a>
    </div>
  `;

  // キャラクター画像が chars/{imgKey}.png として用意されていれば、絵文字の代わりに大きく表示する
  (function loadCharVisual(){
    const testImg = new Image();
    testImg.onload = () => {
      const vis = document.getElementById('char-visual');
      if(vis) vis.innerHTML = `<img src="chars/${imgKey}.png" class="char-icon-img" alt="${cardTitle}">`;
    };
    testImg.onerror = () => {}; // 画像が無ければ絵文字のまま
    testImg.src = `chars/${imgKey}.png`;
  })();
}
main();
</script>
</body>
</html>
