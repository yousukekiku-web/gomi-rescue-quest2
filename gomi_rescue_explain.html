<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ゴミレスキュークエスト｜解説動画</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="ゴミレスキュー解説">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:'BIZ UDPGothic','BIZ UDゴシック','Noto Sans JP','Yu Gothic',sans-serif;}
body{display:flex;align-items:center;justify-content:center;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
  padding-bottom:env(safe-area-inset-bottom);}
video{width:100%;height:100%;object-fit:contain;display:block;background:#000;}
#msg{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;
  color:#fff;font-size:14px;line-height:1.8;padding:0 24px;display:none;}
:where(video):focus-visible{outline:3px solid #fff;outline-offset:-3px;}
</style>
</head>
<body>

<video id="v" playsinline webkit-playsinline preload="metadata" controls controlslist="nodownload nofullscreen"></video>
<p id="msg">動画を読み込めませんでした。<br>ページを再読み込みしてください。</p>

<script>
const v = document.getElementById('v');
const msg = document.getElementById('msg');

/* 動画を差し替えたら ?v= の数字を変える（キャッシュ対策） */
const SRC = {
  portrait:  'assets/tate_move_small.mp4?v=20261105',
  landscape: 'assets/yoko_move_small.mp4?v=20261105'
};

const mq = window.matchMedia('(orientation: portrait)');
let current = null;

/* 画面の向きに合わせて動画を切り替え。再生位置と再生状態は引き継ぐ */
function load(){
  const key = mq.matches ? 'portrait' : 'landscape';
  if(key === current) return;
  const t = v.currentTime || 0;
  const wasPlaying = !v.paused && !v.ended;
  current = key;
  v.src = SRC[key];
  v.addEventListener('loadedmetadata', function once(){
    v.removeEventListener('loadedmetadata', once);
    if(t > 0 && t < v.duration) v.currentTime = t;
    if(wasPlaying) v.play().catch(()=>{});
  });
}
mq.addEventListener('change', load);
v.addEventListener('error', ()=>{ msg.style.display = 'block'; });
load();
</script>
</body>
</html>
