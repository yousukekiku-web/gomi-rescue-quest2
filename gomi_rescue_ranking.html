<style>
:root{
  --gold:#ffb300; --purple:#7653c8; --purpled:#4a287d; --ink:#2a3a4a;
  --blue:#2a72d4; --teal:#0f8f83; --green:#2ecc71;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;color:var(--ink);}
body{background:linear-gradient(160deg,#173a34,#0f8f83);display:flex;align-items:center;justify-content:center;}

#app{width:100%;max-width:460px;height:100%;max-height:900px;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.3);}
@media(min-width:521px){#app{border-radius:28px;height:92vh;}}

.home-link{position:fixed;top:max(env(safe-area-inset-top),10px);left:12px;z-index:999;
  width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.85);border:none;
  font-size:17px;box-shadow:0 3px 10px rgba(0,0,0,.15);cursor:pointer;display:flex;
  align-items:center;justify-content:center;text-decoration:none;color:inherit;}
.home-link:active{transform:scale(.9);}

/* ===== incomplete notice ===== */
.notice{padding:40px 24px;text-align:center;}
.notice .em{font-size:52px;margin-bottom:10px;}
.notice h2{font-family:'Fredoka One',sans-serif;font-size:20px;color:var(--purpled);margin-bottom:10px;}
.notice p{font-size:12.5px;font-weight:700;color:#5a5570;line-height:1.8;margin-bottom:20px;}
.notice a{display:inline-block;background:linear-gradient(135deg,#8a64dd,var(--purple));color:#fff;
  text-decoration:none;font-family:'Fredoka One',sans-serif;font-size:15px;padding:12px 30px;border-radius:40px;
  box-shadow:0 5px 0 var(--purpled);}

/* ===== hero ===== */
.hero{background:linear-gradient(160deg,#173a34,#0f8f83);color:#fff;text-align:center;
  padding:max(env(safe-area-inset-top),26px) 22px 22px;}
.hero-emoji{font-size:42px;}
.hero-title{font-family:'Fredoka One',sans-serif;font-size:19px;color:#c9ffb0;margin:4px 0 8px;
  text-shadow:0 2px 0 rgba(0,0,0,.25);line-height:1.4;}
.hero-copy{font-size:11.5px;font-weight:700;line-height:1.8;color:#e2fff0;max-width:360px;margin:0 auto;}

/* ===== my character recap chip ===== */
.me-chip{margin:14px 18px 0;display:flex;align-items:center;gap:10px;background:#f6f0ff;border-radius:16px;
  padding:10px 14px;text-decoration:none;color:inherit;box-shadow:0 2px 8px rgba(60,30,110,.1);}
.me-chip .mc-icon{width:42px;height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:26px;
  border-radius:9px;overflow:hidden;}
.me-chip .mc-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.me-chip .mc-body{flex:1;min-width:0;}
.me-chip .mc-label{font-size:9px;font-weight:900;color:#9a86b8;letter-spacing:.05em;}
.me-chip .mc-title{font-size:12.5px;font-weight:900;color:var(--purpled);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.me-chip .mc-arrow{font-size:14px;color:#9a86b8;flex-shrink:0;}

/* ===== register ===== */
.register{margin:16px 18px;background:#f0faf3;border:2px dashed #a8e6b8;border-radius:16px;padding:16px;text-align:center;}
.register h3{font-family:'Fredoka One',sans-serif;font-size:16px;color:#1f9c53;margin-bottom:8px;}
.register p{font-size:11px;font-weight:700;color:#4a7a5a;margin-bottom:12px;line-height:1.6;}
.register input{width:100%;padding:11px 14px;border-radius:12px;border:2px solid #b8e8c4;font-size:14px;
  font-weight:700;margin-bottom:10px;text-align:center;background:#fff;color:var(--ink);}
.register input:focus{outline:none;border-color:var(--green);}
.jbrc-link{display:block;font-size:11px;font-weight:900;color:#0f8f6a;background:#e2f9ec;border:2px solid #b8e8c4;
  border-radius:12px;padding:9px 10px;margin-bottom:10px;text-decoration:none;line-height:1.5;}
.jbrc-link:active{transform:translateY(1px);}
.loc-row{display:flex;gap:8px;margin-bottom:12px;}
.loc-row select{flex:1;padding:11px 8px;border-radius:12px;border:2px solid #b8e8c4;font-size:12.5px;
  font-weight:700;background:#fff;color:var(--ink);}
.loc-row input{flex:1;margin-bottom:0;}
.loc-row select:focus{outline:none;border-color:var(--green);}
.loc-section-label{font-size:11px;font-weight:900;color:#4a7a5a;text-align:left;margin-bottom:8px;line-height:1.6;}
.loc-block{background:#fff;border:2px solid #cdeed7;border-radius:14px;padding:12px;margin-bottom:10px;text-align:left;}
.loc-block-num{display:inline-block;font-family:'Fredoka One',sans-serif;font-size:11px;color:#1f9c53;
  background:#dff5e1;border-radius:8px;padding:2px 9px;margin-bottom:8px;}
.loc-block .loc-row{margin-bottom:8px;}
.loc-block input.place-input{margin-bottom:0;text-align:left;font-size:12.5px;}
.loc-hint{font-size:9.5px;color:#6a9a7a;margin:-2px 0 12px;line-height:1.6;text-align:left;}
.btn-register{width:100%;padding:13px;border:none;border-radius:40px;background:linear-gradient(135deg,#5edd7a,var(--green));
  color:#fff;font-family:'Fredoka One',sans-serif;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #1f9c53;}
.btn-register:active{transform:translateY(3px);box-shadow:0 2px 0 #1f9c53;}
.btn-register:disabled{opacity:.5;}
.reg-note{font-size:9.5px;color:#6a9a7a;margin-top:8px;line-height:1.6;}

/* ===== ranking ===== */
.ranking{margin:18px 18px 8px;}
.ranking-title{font-family:'Fredoka One',sans-serif;font-size:17px;color:var(--purpled);text-align:center;margin-bottom:10px;}
.rank-list{display:flex;flex-direction:column;gap:7px;}
.rank-item{display:flex;flex-direction:column;gap:6px;background:#fff;border-radius:12px;padding:10px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);}
.rank-item.me{background:#eafcf0;border:2px solid var(--green);}
.rank-top{display:flex;align-items:center;gap:10px;}
.rank-pos{font-family:'Fredoka One',sans-serif;font-size:15px;width:26px;text-align:center;color:#9a86b8;flex-shrink:0;}
.rank-pos.medal{font-size:19px;}
.rank-char-icon{width:34px;height:42px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;
  border-radius:8px;overflow:hidden;}
.rank-char-icon img{width:100%;height:100%;object-fit:cover;display:block;}
.rank-name{flex:1;min-width:0;}
.rank-name .n{font-size:12.5px;font-weight:900;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-name .t{font-size:9.5px;font-weight:700;color:#8a86a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rank-score{font-family:'Fredoka One',sans-serif;font-size:11px;color:#3ab06a;letter-spacing:.05em;flex-shrink:0;}
.rank-chars{display:flex;gap:5px;flex-wrap:wrap;padding-left:44px;}
.rank-char-badge{display:flex;align-items:center;gap:3px;background:#e2f9ec;border-radius:8px;padding:3px 7px;
  font-size:9.5px;font-weight:700;color:#1f9c53;}
.rank-empty{text-align:center;font-size:11.5px;color:#a89ac0;font-weight:700;padding:16px;}

.btn-view-board{display:block;text-align:center;background:linear-gradient(135deg,#ffcf4d,var(--gold));
  color:#5a3a00;text-decoration:none;font-family:'Fredoka One',sans-serif;font-size:14.5px;line-height:1.5;
  padding:15px 16px;border-radius:18px;box-shadow:0 5px 0 #c98700;}
.btn-view-board:active{transform:translateY(3px);box-shadow:0 2px 0 #c98700;}
.btn-view-board small{display:block;font-family:'BIZ UDPGothic','Noto Sans JP',sans-serif;font-size:10.5px;
  font-weight:700;margin-top:4px;opacity:.85;}

.retry-row{padding:16px 18px 30px;display:flex;flex-direction:column;gap:10px;}
.btn-retry-all{width:100%;padding:14px;border:none;border-radius:40px;background:linear-gradient(135deg,#8a64dd,var(--purple));
  color:#fff;font-family:'Fredoka One',sans-serif;font-size:15px;cursor:pointer;box-shadow:0 5px 0 var(--purpled);}
.btn-retry-all:active{transform:translateY(3px);box-shadow:0 2px 0 var(--purpled);}
.gi{width:1.15em;height:1.15em;vertical-align:-.22em;display:inline-block;flex-shrink:0;}
.home-link .gi,.bgm-btn .gi,.refresh-btn .gi{width:24px;height:24px;vertical-align:0;}
.notice .em .gi{width:52px;height:52px;vertical-align:0;}
.hero-emoji{display:flex;gap:10px;align-items:center;justify-content:center;}
.hero-emoji img,.hero-emoji .gi{width:46px;height:46px;object-fit:contain;vertical-align:0;}
.ti{width:22px;height:22px;object-fit:contain;vertical-align:-5px;margin-right:4px;}
.ti-wrap{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#fff;align-items:center;justify-content:center;margin-right:6px;vertical-align:-7px;}
.ti-wrap img{width:18px;height:18px;object-fit:contain;display:block;}
.jbrc-link .gi,.btn-retry-all .gi{width:1.2em;height:1.2em;}
</style>

<script>
// ════════════════════════════════════════════════
// データテーブル（gomi_rescue_result.html と同じロジックを使い、
// 保存済みのガチャ抽選結果（grq_char_roll）をそのまま再利用する）
// ════════════════════════════════════════════════
const RANK_VAL = {S:4, A:3, B:2, C:1};

const TIER_META = [
  {title:'ただの一般人'},
  {title:'見習いレスキュー隊員'},
  {title:'半人前クリーナー'},
  {title:'頼れる清掃レンジャー'},
  {title:'エリート・ゴミレスキュー隊員'},
  {title:'完全なる掃除人'}
];
function tierIndexFromSum(sum){
  if(sum<=3) return 0;
  if(sum<=5) return 1;
  if(sum<=7) return 2;
  if(sum<=9) return 3;
  if(sum<=11) return 4;
  return 5;
}

function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// gomi_rescue_result.html と同じ抽選ロジック。同じ実績（フィンガープリント）なら
// localStorage（grq_char_roll）に保存済みの結果をそのまま使い、無ければここで新規抽選する。
function rollCharacterVariant(tierIndex, fingerprint){
  try{
    const saved = JSON.parse(localStorage.getItem('grq_char_roll') || 'null');
    if(saved && saved.fp === fingerprint) return saved;
  }catch(e){}
  let variantId = null, rareId = null;
  if(tierIndex === 5){
    const roll = Math.floor(Math.random()*30);
    if(roll < 3){ rareId = RARE_CHARACTERS[roll].id; }
    else{ variantId = pickRandom(TIER_VARIANTS[5]).id; }
  } else {
    variantId = pickRandom(TIER_VARIANTS[tierIndex]).id;
  }
  const result = {fp: fingerprint, tierIndex, variantId, rareId};
  try{ localStorage.setItem('grq_char_roll', JSON.stringify(result)); }catch(e){}
  return result;
}

// ════════════════════════════════════════════════
// 共有ランキング保存（Artifact上ならwindow.storageで全員共有、
// それ以外の環境ではブラウザ内ローカル保存にフォールバック）
//
// ★Supabase移行メモ：将来的にここをSupabaseに差し替える場合は、
//   loadRanking() → supabase.from('grq_ranking').select('*').order('totalScore',{ascending:false})
//   saveRanking(list) → 呼び出し側をinsert 1件（例：supabase.from('grq_ranking').insert(entry)）に変更する形が自然です。
//   現状はリスト全体を読み書きする簡易実装なので、移行時はentry単位のinsert関数に置き換えてください。
// ════════════════════════════════════════════════
async function storageAvailable(){
  return typeof window.storage !== 'undefined' && window.storage;
}
async function loadRanking(){
  try{
    if(await storageAvailable()){
      const res = await window.storage.get('grq_ranking', true);
      return res ? JSON.parse(res.value) : [];
    }
  }catch(e){}
  try{ return JSON.parse(localStorage.getItem('grq_ranking_local') || '[]'); }
  catch(e){ return []; }
}
async function saveRanking(list){
  try{
    if(await storageAvailable()){
      await window.storage.set('grq_ranking', JSON.stringify(list), true);
      return;
    }
  }catch(e){}
  try{ localStorage.setItem('grq_ranking_local', JSON.stringify(list)); }catch(e){}
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
